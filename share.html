<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A file shared with FloFileTransfer" />
    <title>Shared file | FloFileTransfer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .shared-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .shared-topbar {
        width: min(100% - 40px, 1120px);
        margin: 0 auto;
        padding: 24px 0;
      }

      .shared-main {
        width: min(100% - 40px, 720px);
        margin: auto;
        padding: 32px 0 80px;
      }

      .shared-card {
        padding: clamp(24px, 6vw, 48px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .shared-icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin-bottom: 24px;
        border: 1px solid rgba(66, 208, 162, 0.28);
        border-radius: 18px;
        background: rgba(66, 208, 162, 0.1);
        color: var(--green-2);
        font-size: 1.7rem;
      }

      .shared-eyebrow {
        color: var(--green-2);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .shared-card h1 {
        margin: 10px 0 12px;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        letter-spacing: -0.055em;
        overflow-wrap: anywhere;
      }

      .shared-description {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .shared-file-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin: 26px 0;
        padding: 18px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .shared-download {
        width: 100%;
        justify-content: center;
      }

      .shared-host-note {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.6;
      }

      .shared-error {
        padding: 14px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        border-radius: 12px;
        background: rgba(127, 29, 29, 0.2);
        color: #fecaca;
      }

      .shared-footer {
        padding: 20px;
        color: var(--muted);
        text-align: center;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body class="shared-page">
    <header class="shared-topbar">
      <a class="brand" href="./">
        <span class="brand-mark">F</span>
        <span>FloFileTransfer</span>
      </a>
    </header>

    <main class="shared-main">
      <section id="shared-card" class="shared-card" aria-labelledby="shared-title">
        <div class="shared-icon" aria-hidden="true">↓</div>
        <span class="shared-eyebrow">File shared with you</span>
        <h1 id="shared-title">Loading shared file…</h1>
        <p id="shared-description" class="shared-description">
          Preparing your download.
        </p>
        <div id="shared-file-info" class="shared-file-info"></div>
        <a id="shared-download" class="primary-btn shared-download hidden" href="">
          Download file
        </a>
        <p id="shared-host-note" class="shared-host-note hidden">
          Your download is securely hosted by Filebin. FloFileTransfer does not
          store a copy of this file.
        </p>
      </section>
    </main>

    <footer class="shared-footer">Shared with FloFileTransfer</footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const title = document.getElementById("shared-title");
      const description = document.getElementById("shared-description");
      const info = document.getElementById("shared-file-info");
      const download = document.getElementById("shared-download");
      const hostNote = document.getElementById("shared-host-note");

      function formatSize(size) {
        if (!Number.isFinite(size) || size <= 0) return "Size unavailable";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const index = Math.min(Math.floor(Math.log(size) / Math.log(1024)), units.length - 1);
        const value = size / 1024 ** index;
        return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
      }

      function showError(message) {
        title.textContent = "This share link is invalid";
        description.textContent = message;
        description.classList.add("shared-error");
        info.classList.add("hidden");
      }

      const fileName = params.get("name");
      const fileUrl = params.get("url");
      const fileSize = Number(params.get("size"));
      const fileType = params.get("type");

      try {
        const downloadUrl = new URL(fileUrl);
        if (
          downloadUrl.protocol !== "https:" ||
          downloadUrl.hostname !== "filebin.net" ||
          !/^\/[A-Za-z0-9_-]{8,60}\/[^/]+$/.test(downloadUrl.pathname) ||
          !fileName
        ) {
          throw new Error("This link does not contain a valid Filebin download.");
        }

        title.textContent = fileName;
        description.textContent = "Your file is ready to download.";
        info.textContent = `${formatSize(fileSize)} · ${fileType || "File"} · Hosted by Filebin`;
        download.href = downloadUrl.href;
        download.classList.remove("hidden");
        hostNote.classList.remove("hidden");
      } catch (error) {
        showError(error.message || "The download link could not be opened.");
      }
    </script>
  </body>
</html>

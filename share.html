<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransferFlow | Download</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .share-box {
        max-width: 700px;
        margin: 0 auto;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.5);
      }

      .share-box h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .meta {
        color: #a9bbd6;
        margin-bottom: 22px;
        line-height: 1.7;
      }

      .download-btn {
        display: inline-block;
        background: linear-gradient(135deg, #7c3aed, #22d3ee);
        color: white;
        border-radius: 14px;
        padding: 16px 22px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="share-box">
      <h1>Download file</h1>
      <div id="share-meta" class="meta">Loading…</div>
      <a id="download-link" class="download-btn" href="#">Download file</a>
    </div>

    <script src="./upload-storage.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const fileId = params.get("file");
      const meta = document.getElementById("share-meta");
      const link = document.getElementById("download-link");

      async function loadSharedFile() {
        if (!fileId) {
          meta.textContent = "This link does not include a file ID.";
          link.style.display = "none";
          return;
        }

        try {
          const file = await window.uploadFileStorage.get(fileId);
          if (!file) {
            meta.textContent =
              "This file is not saved in this browser profile. Local upload links only work in the browser that created them.";
            link.style.display = "none";
            return;
          }

          meta.textContent = `${file.name} · ${formatSize(file.size)} · ${file.type}`;
          link.href = URL.createObjectURL(file.file);
          link.download = file.name;
        } catch (error) {
          console.error("Could not load shared file:", error);
          meta.textContent = "Could not access this browser's saved files. Check browser storage permissions and try again.";
          link.style.display = "none";
        }
      }

      function formatSize(size) {
        if (!size) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const index = Math.min(Math.floor(Math.log(size) / Math.log(1024)), units.length - 1);
        const value = size / 1024 ** index;
        return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
      }

      loadSharedFile();
    </script>
  </body>
</html>
